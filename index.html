1)}.access-row{background:linear-gradient(135deg,#bc3a46,#98212e)}.access-row.reopen{background:linear-gradient(135deg,#329465,#21734a)}.manager-row{background:linear-gradient(135deg,#8261b2,#513b7c)}.manager-row:disabled{opacity:.5;cursor:not-allowed}#visit-panel{background:linear-gradient(135deg,#133b64,#27768b);border:1px solid #317c91;box-shadow:0 8px 22px #173f7230}#visit-panel>h3{color:white;border-left:5px solid #f6db31;padding-left:12px}#visit-panel>p{color:#e1f1fa;line-height:1.5}#visit-panel>button{background:#f6db31;color:#173f72}.visit-results{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:14px;margin-top:18px}.visit-card{background:linear-gradient(145deg,#fff,#e9f5fa);border-radius:14px;border-top:4px solid #f6db31;box-shadow:0 5px 12px #08273b30;overflow:hidden}.visit-card:nth-child(3n+2){border-top-color:#55d0b2}.visit-card:nth-child(3n){border-top-color:#bca2ec}.visit-card-title{padding:14px;background:#e0edf7;display:flex;align-items:center;justify-content:space-between;gap:10px;color:#173f72}.visit-count{background:#173f72;color:white;border-radius:20px;padding:6px 10px;font-size:12px;white-space:nowrap}.visit-metrics{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:14px}.visit-metrics>div{background:#e0f4f0;border:1px solid #b6ded4;border-radius:10px;padding:10px}.visit-metrics>div+div{background:#eee8fa;border-color:#d8c9ec}.visit-metrics span{display:block;font-size:12px;color:#587082;margin-bottom:8px}.visit-metrics strong{font-size:14px;color:#173f72;line-height:1.5}#admin-inbox,#player-message-box{background:linear-gradient(145deg,#ede7fa,#f5f2fd);border-left:5px solid #8b65b6;box-shadow:0 8px 22px #58367c18}#admin-inbox summary{background:linear-gradient(110deg,#513776,#825aab);color:white;padding:16px;border-radius:10px}#admin-inbox .unread-count{display:inline-block;background:#ffe46d;color:#513776;border-radius:20px;padding:5px 10px;font-size:14px;margin:6px}#admin-inbox details>p,#player-message-box> </head>
  <body>
    <main class="shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">MECİDİYE KARAHİSAR SPOR KULÜBÜ</p>
          <h1>Takım İstatistikleri</h1>
          <p id="season-label">2026–2027 Sezonu</p>
        </div>
        <button id="logout" class="secondary hidden">Çıkış yap</button>
      </header>

      <section id="login-view" class="login-card">
        <p class="eyebrow">Oyuncu ve yönetici girişi</p>
        <h2>İstatistiklerine eriş</h2>
        <form id="login-form">
          <label>E-posta<input id="email" type="email" autocomplete="email" required /></label>
          <label>Şifre<input id="password" type="password" autocomplete="current-password" required /></label>
          <button type="submit">Giriş yap</button>
          <p id="login-error" class="error" aria-live="polite"></p>
        </form>
      </section>

      <section id="player-view" class="hidden">
        <div class="welcome"><p class="eyebrow">Oyuncu paneli</p><h2 id="player-name"></h2></div>
        <div id="player-summary" class="summary-grid"></div>
        <section class="card"><h3>Sezon istatistikleri</h3><div id="player-stats" class="stat-list"></div></section>
      </section>

      <section id="admin-view" class="hidden">
        <div class="admin-heading">
          <div><p class="eyebrow">Yönetici paneli</p><h2>Kadro ve istatistikler</h2></div>
          <div class="admin-actions"><button id="share-report" type="button">Takım listesini paylaş</button><button class="rank-share" data-rank="goals" type="button">Gol krallığı</button><button class="rank-share" data-rank="assists" type="button">Asist krallığı</button><button class="rank-share" data-rank="most" type="button">En çok maç</button><button class="rank-share" data-rank="least" type="button">En az maç</button><input id="search" type="search" placeholder="Oyuncu ara" aria-label="Oyuncu ara" /></div>
        </div>
        <form id="add-player-form" class="add-player"><strong>Yeni oyuncu ekle</strong><input name="full_name" placeholder="Ad soyad" required /><input name="jersey_number" type="number" min="0" placeholder="Forma no" /><input name="position" placeholder="Mevki" /><button type="submit">Oyuncu ekle</button></form>
        <div id="admin-message" class="notice" aria-live="polite"></div>
        <div id="roster" class="roster"></div>
      </section>
    </main>
    <script src="config.js"></script>
    <script type="module" src="app.js?v=20261014-complete-3"></script>
  </body>
</html>
